<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scripts CAP/DEPROT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="layout">
        <!-- SIDEBAR -->
        <aside>
            <div class="sb-head">
                <div>
                    <h1>📨 Scripts <span>CAP/DEPROT</span></h1>
                    <p>Gerenciador de modelos</p>
                </div>
                <button class="theme-toggle" id="themeBtn">Modo Escuro</button>
            </div>
            <div class="sb-search">
                <input type="text" id="searchInput" placeholder="🔍 Buscar script…" oninput="onSearch(this.value)">
            </div>
            <div id="sidebarNav"></div>
            <div class="sb-reorder">
                <button class="btn-reorder" onclick="openCategoryModal()">📂 Gerenciar categorias</button>
            </div>
            <div class="sb-foot">
                <div class="config-section">
                    <label>👤 Sua assinatura</label>
                    <input type="text" id="userNameInput" placeholder="Escreva aqui seu nome e sobrenome" oninput="updateSignature()">
                </div>
                <button onclick="resetLocalData()" class="btn-reset">🔄 Resetar alterações locais</button>
                <div class="drop-zone" id="dropZone" onclick="document.getElementById('importFile').click()">
                    📥 Arraste ou clique para importar JSON
                    <input type="file" id="importFile" style="display:none" accept=".json" onchange="handleImport(event)">
                </div>
            </div>
        </aside>

        <!-- MAIN -->
        <main>
            <div class="top-bar">
                <h2 id="pageTitle">Todos os scripts</h2>
                <span class="badge" id="badge"></span>
                <select class="sort-select" id="sortSelect" onchange="applySort()">
                    <option value="title">Ordenar por: Título</option>
                    <option value="category">Ordenar por: Categoria</option>
                    <option value="id">Ordenar por: Data (criação)</option>
                    <option value="favorite">⭐ Favoritos</option>
                    <option value="custom">✨ Ordem personalizada</option>
                </select>
                <button class="btn-export" onclick="exportJSON()">📤 Exportar JSON</button>
                <button class="btn-add" onclick="openModal()">➕ Novo script</button>
            </div>
            <div id="cards"><div class="loading">⏳ Carregando scripts…</div></div>
            <div class="empty" id="empty" style="display:none">
                <div class="icon">📭</div>
                <p>Nenhum script encontrado.</p>
            </div>
        </main>
    </div>

    <!-- MODAL NOVO SCRIPT -->
    <div class="overlay" id="overlay" onclick="if(event.target===this) closeModal()">
        <div class="modal">
            <h3>➕ Novo script</h3>
            <div class="field">
                <label>Título</label>
                <input type="text" id="newTitle" placeholder="Ex: Solicitando documentos adicionais">
            </div>
            <div class="field">
                <label>Categoria</label>
                <div class="category-input-wrapper">
                    <input type="text" id="newCategoryInput" placeholder="Digite o nome da categoria..." autocomplete="off" oninput="filterCategorySuggestions(this.value)">
                    <div id="categorySuggestions" class="suggestions-list"></div>
                </div>
                <input type="hidden" id="newCategoryHidden" value="">
            </div>
            <div class="field checkbox-field">
                <input type="checkbox" id="newGreeting" checked>
                <label for="newGreeting">🕐 Incluir saudação automática</label>
            </div>
            <div class="field checkbox-field">
                <input type="checkbox" id="newSignature" checked>
                <label for="newSignature">✍️ Incluir assinatura</label>
            </div>
            <div class="field">
                <label>Texto do script (somente o corpo, sem saudação e sem assinatura)</label>
                <textarea id="newText" placeholder="Cole ou escreva o texto aqui…"></textarea>
            </div>
            <div class="modal-btns">
                <button class="btn-sec" onclick="closeModal()">Cancelar</button>
                <button class="btn-primary" onclick="addScript()">Adicionar</button>
            </div>
        </div>
    </div>

    <!-- MODAL GERENCIAR CATEGORIAS -->
    <div class="overlay" id="categoryModal" onclick="if(event.target===this) closeCategoryModal()">
        <div class="modal modal-category">
            <h3>📂 Gerenciar categorias</h3>
            <p style="color:var(--text-secondary);font-size:13px;margin-bottom:16px;">Arraste para reordenar. Clique no nome para renomear. Clique em "🗑️" para excluir.</p>
            <div id="categoryListContainer">
                <div class="category-list-loading">Carregando...</div>
            </div>
            <div class="category-modal-actions">
                <input type="text" id="newCategoryName" placeholder="Digite o nome da nova categoria..." onkeydown="if(event.key==='Enter') createCategoryFromModal()">
                <button class="btn-primary" onclick="createCategoryFromModal()">➕ Adicionar</button>
            </div>
            <div class="modal-btns">
                <button class="btn-sec" onclick="closeCategoryModal()">Fechar</button>
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast"><span class="icon"></span><span class="msg"></span></div>

    <script src="js/app.js"></script>
</body>
</html>
