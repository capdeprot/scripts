<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scripts CAP/DEPROT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F6F4F0;
  --surface: #FFFFFF;
  --surface2: #EDEAE2;
  --border: #D8D3C8;
  --text: #1C1A17;
  --text-secondary: #6B655C;
  --accent: #1E4F7A;
  --accent-hover: #163D5E;
  --accent-light: #EBF2FA;
  --green: #1F8B4C;
  --green-hover: #166F3B;
  --red: #B91C1C;
  --red-light: #FEE2E2;
  --orange: #D97706;
  --orange-light: #FEF3C7;
  --shadow: 0 1px 3px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.04);
  --shadow-hover: 0 4px 12px rgba(0,0,0,.08), 0 12px 40px rgba(0,0,0,.06);
  --radius: 12px;
  --radius-sm: 8px;
  --transition: .25s cubic-bezier(.4,0,.2,1);
}

[data-theme="dark"] {
  --bg: #121212;
  --surface: #1E1E1E;
  --surface2: #2A2A2A;
  --border: #3A3A3A;
  --text: #E8E3D8;
  --text-secondary: #A8A098;
  --accent: #4A8DC7;
  --accent-hover: #5A9DD7;
  --accent-light: #1A2A3A;
  --green: #34B86A;
  --green-hover: #44C87A;
  --red: #EF4444;
  --red-light: #3A1A1A;
  --orange: #F59E0B;
  --orange-light: #3A2A0A;
  --shadow: 0 1px 3px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.2);
  --shadow-hover: 0 4px 12px rgba(0,0,0,.4), 0 12px 40px rgba(0,0,0,.3);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.6;
  min-height: 100vh;
  transition: background var(--transition), color var(--transition);
}

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

.layout { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }

aside {
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh;
  overflow-y: auto;
  transition: background var(--transition), border-color var(--transition);
}

.sb-head {
  padding: 24px 20px 16px;
  border-bottom: 1px solid var(--border);
}
.sb-head h1 {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -.02em;
}
.sb-head h1 span { color: var(--accent); }
.sb-head p {
  font-size: 10px;
  color: var(--text-secondary);
  letter-spacing: .08em;
  text-transform: uppercase;
  font-weight: 500;
  margin-top: 2px;
}
.sb-head .theme-toggle {
  width: 100%;
  margin-top: 10px;
  padding: 6px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all var(--transition);
  text-align: center;
}
.sb-head .theme-toggle:hover {
  background: var(--surface2);
  border-color: var(--text-secondary);
}

.sb-search { padding: 12px 20px; }
.sb-search input {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 8px 14px;
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  outline: none;
  transition: all var(--transition);
}
.sb-search input::placeholder { color: var(--text-secondary); opacity: .6; }
.sb-search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(30,79,122,.15); }

.cat-lbl {
  padding: 12px 20px 4px;
  font-size: 10px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--text-secondary);
  font-weight: 600;
}
nav ul { list-style: none; padding: 0 12px; }

nav ul li {
  margin-bottom: 2px;
}
nav ul li a {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 7px 12px;
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  font-size: 13px;
  cursor: grab;
  transition: all var(--transition);
  text-decoration: none;
  user-select: none;
}
nav ul li a:hover { background: var(--surface2); color: var(--text); }
nav ul li a:active { cursor: grabbing; }
nav ul li a.active { background: var(--accent-light); color: var(--accent); font-weight: 600; }
nav ul li.dragging a {
  opacity: .4;
  cursor: grabbing;
}
nav ul li.drag-over a {
  background: var(--accent-light);
  border: 2px dashed var(--accent);
  border-radius: var(--radius-sm);
}
.nav-count {
  font-size: 11px;
  background: var(--surface2);
  padding: 1px 8px;
  border-radius: 12px;
  font-weight: 500;
  color: var(--text-secondary);
  transition: all var(--transition);
  pointer-events: none;
}
nav ul li a.active .nav-count {
  background: var(--accent);
  color: #fff;
}

.sb-foot {
  margin-top: auto;
  padding: 16px 20px;
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.sb-foot .config-section label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--text-secondary);
  font-weight: 600;
  display: block;
  margin-bottom: 4px;
}
.sb-foot .config-section input {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 6px 12px;
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  outline: none;
  transition: all var(--transition);
}
.sb-foot .config-section input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(30,79,122,.12); }

.sb-foot button {
  width: 100%;
  padding: 7px 12px;
  border-radius: var(--radius-sm);
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  transition: all var(--transition);
}
.sb-foot button:hover { background: var(--surface2); }
.sb-foot .btn-reset {
  border-color: var(--orange);
  color: var(--orange);
  background: var(--orange-light);
}
.sb-foot .btn-reset:hover {
  background: var(--orange);
  color: #fff;
}

main { padding: 32px 40px; max-width: 1000px; }

.top-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 28px;
  flex-wrap: wrap;
}
.top-bar h2 {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -.02em;
  flex: 1;
}
.top-bar .badge {
  font-size: 12px;
  background: var(--surface2);
  color: var(--text-secondary);
  padding: 4px 12px;
  border-radius: 20px;
  font-weight: 500;
}
.top-bar .sort-select {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 6px 12px;
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  color: var(--text);
  cursor: pointer;
  outline: none;
  transition: all var(--transition);
}
.top-bar .sort-select:focus { border-color: var(--accent); }

.btn-add, .btn-export {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 16px;
  border-radius: var(--radius-sm);
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--transition);
  border: none;
}
.btn-add {
  background: var(--accent);
  color: #fff;
}
.btn-add:hover { background: var(--accent-hover); transform: translateY(-1px); }
.btn-export {
  background: var(--surface2);
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-export:hover { background: var(--border); transform: translateY(-1px); }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 12px;
  box-shadow: var(--shadow);
  transition: all var(--transition);
}
.card:hover { box-shadow: var(--shadow-hover); }

.card-hd {
  display: flex;
  align-items: center;
  padding: 14px 18px;
  cursor: pointer;
  gap: 12px;
  border-radius: var(--radius);
  transition: background var(--transition);
}
.card-hd:hover { background: var(--bg); }
.card.open .card-hd { border-radius: var(--radius) var(--radius) 0 0; }

.card-info { flex: 1; min-width: 0; }
.card-title {
  font-size: 14px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.greeting-icon {
  font-size: 10px;
  background: var(--accent-light);
  color: var(--accent);
  padding: 2px 10px;
  border-radius: 12px;
  font-weight: 500;
}
.card-tag {
  font-size: 10px;
  background: var(--surface2);
  color: var(--text-secondary);
  padding: 2px 10px;
  border-radius: 4px;
  font-weight: 500;
  display: inline-block;
  margin-top: 2px;
}

.card-btns { display: flex; gap: 4px; flex-shrink: 0; }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 5px 10px;
  border-radius: var(--radius-sm);
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  border: none;
  transition: all var(--transition);
  white-space: nowrap;
}
.btn-copy { background: var(--accent); color: #fff; }
.btn-copy:hover { background: var(--accent-hover); }
.btn-copy.ok { background: var(--green); }
.btn-ghost { background: var(--surface2); color: var(--text-secondary); }
.btn-ghost:hover { background: var(--border); color: var(--text); }
.btn-del {
  background: var(--red-light);
  color: var(--red);
  padding: 5px 8px;
}
.btn-del:hover { background: var(--red); color: #fff; }

.chev {
  width: 16px;
  height: 16px;
  color: var(--text-secondary);
  transition: transform var(--transition);
  flex-shrink: 0;
}
.card.open .chev { transform: rotate(180deg); }

.card-body { display: none; border-top: 1px solid var(--border); }
.card.open .card-body { display: block; }

.preview {
  padding: 20px 24px;
  background: var(--bg);
  font-size: 13.5px;
  line-height: 1.7;
  border-radius: 0 0 var(--radius) var(--radius);
  transition: background var(--transition);
}
.preview.editing-mode { display: none; }
.preview p { margin-bottom: 0.8em; }
.preview p:last-child { margin-bottom: 0; }
.preview a { color: var(--accent); text-decoration: none; }
.preview a:hover { text-decoration: underline; }
.preview ul { padding-left: 1.5em; margin-bottom: 0.8em; }
.preview li { margin-bottom: 0.2em; }

.editor-wrap { display: none; flex-direction: column; }
.editor-wrap.visible { display: flex; }
.editor-wrap .fmt-bar {
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 6px 14px;
  border-bottom: 1px solid var(--border);
  background: var(--surface2);
  flex-wrap: wrap;
}
.fmt-btn {
  width: 30px;
  height: 30px;
  border-radius: var(--radius-sm);
  border: none;
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  transition: all var(--transition);
}
.fmt-btn:hover { background: var(--border); color: var(--text); }
.fmt-btn.active { background: var(--accent); color: #fff; }
.fmt-sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }

[contenteditable] {
  padding: 18px 22px;
  min-height: 160px;
  font-family: 'Inter', sans-serif;
  font-size: 13.5px;
  line-height: 1.7;
  color: var(--text);
  background: var(--bg);
  outline: none;
  transition: background var(--transition);
}
[contenteditable] p { margin-bottom: 0.8em; }
[contenteditable] p:last-child { margin-bottom: 0; }
[contenteditable] a { color: var(--accent); }
[contenteditable] ul { padding-left: 1.5em; margin-bottom: 0.8em; }
[contenteditable] li { margin-bottom: 0.2em; }
[contenteditable]:empty::before { content: attr(data-placeholder); color: var(--text-secondary); opacity: .5; pointer-events: none; }

.edit-bar {
  display: flex;
  gap: 6px;
  align-items: center;
  padding: 8px 14px;
  background: var(--surface2);
  border-top: 1px solid var(--border);
  border-radius: 0 0 var(--radius) var(--radius);
  flex-wrap: wrap;
}
.edit-bar .title-field {
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 4px 10px;
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  background: var(--bg);
  color: var(--text);
  outline: none;
  width: 200px;
  margin-left: auto;
}
.edit-bar .title-field:focus { border-color: var(--accent); }
.btn-save { background: var(--green); color: #fff; }
.btn-save:hover { background: var(--green-hover); }
.btn-save:disabled { opacity: .5; cursor: not-allowed; }

.live-preview {
  padding: 14px 20px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  font-size: 13px;
  line-height: 1.6;
  max-height: 200px;
  overflow-y: auto;
  display: none;
}
.live-preview.visible { display: block; }
.live-preview .label {
  font-size: 10px;
  text-transform: uppercase;
  color: var(--text-secondary);
  font-weight: 600;
  letter-spacing: .05em;
  margin-bottom: 6px;
}

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 200;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--transition);
}
.overlay.show { opacity: 1; pointer-events: all; }
.modal {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 28px 32px;
  width: 540px;
  max-width: 95vw;
  box-shadow: 0 20px 60px rgba(0,0,0,.2);
  transform: translateY(12px);
  transition: transform var(--transition);
}
.overlay.show .modal { transform: translateY(0); }
.modal h3 { font-size: 20px; font-weight: 700; margin-bottom: 20px; }
.field { margin-bottom: 14px; }
.field label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 4px;
  letter-spacing: .05em;
  text-transform: uppercase;
}
.field input, .field select, .field textarea {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 8px 12px;
  font-family: 'Inter', sans-serif;
  font-size: 13.5px;
  color: var(--text);
  background: var(--bg);
  outline: none;
  transition: all var(--transition);
}
.field input:focus, .field select:focus, .field textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(30,79,122,.12);
}
.field textarea { min-height: 100px; resize: vertical; line-height: 1.6; }
.modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
.btn-primary {
  background: var(--accent);
  color: #fff;
  padding: 8px 20px;
  border-radius: var(--radius-sm);
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: all var(--transition);
}
.btn-primary:hover { background: var(--accent-hover); }
.btn-sec {
  background: var(--surface2);
  color: var(--text-secondary);
  padding: 8px 18px;
  border-radius: var(--radius-sm);
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  border: 1px solid var(--border);
  transition: all var(--transition);
}
.btn-sec:hover { background: var(--border); }

.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: var(--text);
  color: var(--bg);
  padding: 10px 18px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 500;
  box-shadow: 0 4px 20px rgba(0,0,0,.2);
  opacity: 0;
  transform: translateY(8px);
  transition: all var(--transition);
  pointer-events: none;
  z-index: 300;
  display: flex;
  align-items: center;
  gap: 8px;
}
.toast.show { opacity: 1; transform: translateY(0); }
.toast .icon { font-size: 16px; }

.empty { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
.empty .icon { font-size: 40px; margin-bottom: 12px; opacity: .4; }
.empty p { font-size: 14px; }

.drop-zone {
  border: 2px dashed var(--border);
  border-radius: var(--radius);
  padding: 30px;
  text-align: center;
  color: var(--text-secondary);
  transition: all var(--transition);
  cursor: pointer;
  margin-top: 12px;
}
.drop-zone.dragover {
  border-color: var(--accent);
  background: var(--accent-light);
}

@media (max-width: 820px) {
  .layout { grid-template-columns: 1fr; }
  aside { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--border); }
  main { padding: 20px; }
}

@media (max-width: 480px) {
  .top-bar { flex-direction: column; align-items: stretch; }
  .card-hd { flex-wrap: wrap; }
  .card-btns { margin-top: 6px; flex-wrap: wrap; }
  .edit-bar { flex-direction: column; align-items: stretch; }
  .edit-bar .title-field { width: 100%; margin-left: 0; }
}
</style>
</head>
<body>
<div class="layout">
  <aside>
    <div class="sb-head">
      <div>
        <h1>📨 Scripts <span>CAP/DEPROT</span></h1>
        <p>Gerenciador de modelos</p>
      </div>
      <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">Modo Escuro</button>
    </div>
    <div class="sb-search">
      <input type="text" id="searchInput" placeholder="🔍 Buscar script…" oninput="onSearch(this.value)">
    </div>
    <div id="sidebarNav"></div>
    <div class="sb-foot">
      <div class="config-section">
        <label>👤 Sua assinatura</label>
        <input type="text" id="userNameInput" placeholder="Escreva aqui seu nome" oninput="updateSignature()">
      </div>
      <button onclick="resetLocalData()" class="btn-reset">🔄 Resetar alterações locais</button>
      <div class="drop-zone" id="dropZone" onclick="document.getElementById('importFile').click()">
        📥 Arraste ou clique para importar JSON
        <input type="file" id="importFile" style="display:none" accept=".json" onchange="handleImport(event)">
      </div>
    </div>
  </aside>

  <main>
    <div class="top-bar">
      <h2 id="pageTitle">Todos os scripts</h2>
      <span class="badge" id="badge"></span>
      <select class="sort-select" id="sortSelect" onchange="applySort()">
        <option value="title">Ordenar por: Título</option>
        <option value="category">Ordenar por: Categoria</option>
        <option value="id">Ordenar por: Data (criação)</option>
        <option value="custom">✨ Ordem personalizada</option>
      </select>
      <button class="btn-export" onclick="exportJSON()">📤 Exportar JSON</button>
      <button class="btn-add" onclick="openModal()">➕ Novo script</button>
    </div>
    <div id="cards"><div class="loading" style="text-align:center;padding:60px;color:var(--text-secondary)">⏳ Carregando scripts…</div></div>
    <div class="empty" id="empty" style="display:none">
      <div class="icon">📭</div>
      <p>Nenhum script encontrado.</p>
    </div>
  </main>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3>➕ Novo script</h3>
    <div class="field">
      <label>Título</label>
      <input type="text" id="newTitle" placeholder="Ex: Solicitando documentos adicionais">
    </div>
    <div class="field">
      <label>Categoria existente</label>
      <select id="newCat"></select>
    </div>
    <div class="field">
      <label>Nova categoria (opcional)</label>
      <input type="text" id="newCatCustom" placeholder="Deixe em branco para usar a categoria acima">
    </div>
    <div class="field">
      <label>Texto do script</label>
      <textarea id="newText" placeholder="Cole ou escreva o texto aqui…"></textarea>
    </div>
    <div class="modal-btns">
      <button class="btn-sec" onclick="closeModal()">Cancelar</button>
      <button class="btn-primary" onclick="addScript()">Adicionar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"><span class="icon"></span><span class="msg"></span></div>

<script>
// ============================================================
//  ESTADO GLOBAL
// ============================================================
let scripts = [];
let nextId = 100;
let activeCat = 'all';
let searchQ = '';
let originalScripts = [];
let sortBy = 'title';
let customCategoryOrder = [];
let isCustomOrderActive = false;

// ============================================================
//  TEMA (DARK MODE)
// ============================================================
function getTheme() {
  return localStorage.getItem('theme') || 'light';
}

function setTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('theme', theme);
  const btn = document.getElementById('themeBtn');
  btn.textContent = theme === 'dark' ? '☀️ Modo Claro' : '🌙 Modo Escuro';
}

function toggleTheme() {
  const current = getTheme();
  setTheme(current === 'dark' ? 'light' : 'dark');
}

// ============================================================
//  SAUDAÇÃO
// ============================================================
function saudacao() {
  const h = new Date().getHours();
  if (h >= 5 && h < 12) return 'Bom dia';
  if (h >= 12 && h < 18) return 'Boa tarde';
  return 'Boa noite';
}

function applyGreetingForDisplay(html) {
  return html.replace(/<saudacao>/g, saudacao());
}

function hasGreetingTag(html) {
  return html.includes('<saudacao>');
}

// ============================================================
//  ASSINATURA
// ============================================================
function getSignature() {
  const name = document.getElementById('userNameInput').value.trim();
  return name || '------';
}

function applySignature(html) {
  return html.replace(/\[NOME_USUARIO\]/g, getSignature());
}

function updateSignature() {
  localStorage.setItem('user_signature', document.getElementById('userNameInput').value.trim());
  render();
  showToast('✅', 'Assinatura atualizada!');
}

function loadUserName() {
  const saved = localStorage.getItem('user_signature');
  if (saved) document.getElementById('userNameInput').value = saved;
}

// ============================================================
//  ORDEM PERSONALIZADA DAS CATEGORIAS
// ============================================================
function loadCustomOrder() {
  const saved = localStorage.getItem('category_order');
  if (saved) {
    try {
      customCategoryOrder = JSON.parse(saved);
      isCustomOrderActive = customCategoryOrder.length > 0;
    } catch (e) {
      customCategoryOrder = [];
      isCustomOrderActive = false;
    }
  } else {
    customCategoryOrder = [];
    isCustomOrderActive = false;
  }
}

function saveCustomOrder() {
  localStorage.setItem('category_order', JSON.stringify(customCategoryOrder));
  isCustomOrderActive = customCategoryOrder.length > 0;
  if (isCustomOrderActive) {
    // Ativa automaticamente a ordenação personalizada
    sortBy = 'custom';
    document.getElementById('sortSelect').value = 'custom';
    render();
  }
}

function getOrderedCategories(cats) {
  if (sortBy !== 'custom' || customCategoryOrder.length === 0) {
    return cats;
  }
  const ordered = [];
  const remaining = [];
  const catSet = new Set(cats);
  
  customCategoryOrder.forEach(cat => {
    if (catSet.has(cat)) {
      ordered.push(cat);
      catSet.delete(cat);
    }
  });
  catSet.forEach(cat => ordered.push(cat));
  return ordered;
}

// ============================================================
//  CARREGAR DADOS
// ============================================================
async function loadData() {
  try {
    const response = await fetch('scripts.json');
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const text = await response.text();
    originalScripts = JSON.parse(text);
    loadUserName();
    loadCustomOrder();

    const local = localStorage.getItem('scripts_capdeprot');
    if (local) {
      scripts = JSON.parse(local);
      showToast('📂', 'Dados carregados do cache local');
    } else {
      scripts = JSON.parse(JSON.stringify(originalScripts));
      showToast('✅', 'Scripts carregados com sucesso');
    }

    // Se há ordem personalizada salva, ativa automaticamente
    if (isCustomOrderActive) {
      sortBy = 'custom';
      document.getElementById('sortSelect').value = 'custom';
    }

    nextId = Math.max(...scripts.map(s => s.id), 0) + 1;
    buildSidebar();
    render();
  } catch (err) {
    console.error(err);
    document.getElementById('cards').innerHTML =
      '<div class="empty"><div class="icon">❌</div><p>Erro ao carregar scripts.json. Verifique se o arquivo existe.</p></div>';
  }
}

// ============================================================
//  RESET
// ============================================================
function resetLocalData() {
  if (!confirm('⚠️ Isso vai apagar suas alterações locais e recarregar os templates originais. Continuar?')) return;
  localStorage.removeItem('scripts_capdeprot');
  scripts = JSON.parse(JSON.stringify(originalScripts));
  nextId = Math.max(...scripts.map(s => s.id), 0) + 1;
  buildSidebar();
  render();
  showToast('🔄', 'Alterações locais removidas!');
}

function saveToLocal() {
  localStorage.setItem('scripts_capdeprot', JSON.stringify(scripts));
  showToast('💾', 'Alterações salvas localmente');
}

// ============================================================
//  CATEGORIAS & SIDEBAR
// ============================================================
function getCategories() {
  const cats = ['all'];
  scripts.forEach(s => { if (!cats.includes(s.cat)) cats.push(s.cat); });
  return cats;
}

function getFilteredScripts() {
  let filtered = activeCat === 'all' ? scripts : scripts.filter(s => s.cat === activeCat);
  if (searchQ) {
    const q = searchQ.toLowerCase();
    filtered = filtered.filter(s =>
      s.title.toLowerCase().includes(q) ||
      s.cat.toLowerCase().includes(q) ||
      s.html.toLowerCase().includes(q)
    );
  }
  return applySortFn(filtered);
}

function applySortFn(list) {
  const s = sortBy;
  if (s === 'title') return [...list].sort((a,b) => a.title.localeCompare(b.title));
  if (s === 'category') return [...list].sort((a,b) => a.cat.localeCompare(b.cat));
  if (s === 'id') return [...list].sort((a,b) => a.id - b.id);
  if (s === 'custom') return list;
  return list;
}

function applySort() {
  sortBy = document.getElementById('sortSelect').value;
  if (sortBy === 'custom') {
    loadCustomOrder();
  }
  render();
}

// ============================================================
//  DRAG & DROP DAS CATEGORIAS
// ============================================================
let draggedItem = null;
let draggedCategory = null;

function initDragDrop() {
  const items = document.querySelectorAll('#sidebarNav ul li');
  items.forEach(item => {
    item.setAttribute('draggable', 'true');
    item.style.cursor = 'grab';
    
    item.addEventListener('dragstart', (e) => {
      draggedItem = item;
      draggedCategory = item.querySelector('a').textContent.trim().split(' ')[0];
      item.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', '');
    });
    
    item.addEventListener('dragend', () => {
      item.classList.remove('dragging');
      item.style.cursor = 'grab';
      document.querySelectorAll('#sidebarNav ul li').forEach(el => {
        el.classList.remove('drag-over');
      });
      // Atualiza a ordem e ativa o modo personalizado
      updateCustomOrderFromDOM();
      draggedItem = null;
      draggedCategory = null;
    });
    
    item.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      item.classList.add('drag-over');
    });
    
    item.addEventListener('dragleave', () => {
      item.classList.remove('drag-over');
    });
    
    item.addEventListener('drop', (e) => {
      e.preventDefault();
      item.classList.remove('drag-over');
      
      if (!draggedItem || draggedItem === item) return;
      
      const parent = item.parentNode;
      const items = Array.from(parent.querySelectorAll('li'));
      const draggedIndex = items.indexOf(draggedItem);
      const targetIndex = items.indexOf(item);
      
      if (draggedIndex < targetIndex) {
        parent.insertBefore(draggedItem, item.nextSibling);
      } else {
        parent.insertBefore(draggedItem, item);
      }
      
      // A ordem será salva no dragend
    });
  });
}

function updateCustomOrderFromDOM() {
  const items = document.querySelectorAll('#sidebarNav ul li a');
  const newOrder = [];
  items.forEach(a => {
    const text = a.textContent.trim();
    const catName = text.replace(/\s*\(\d+\)\s*$/, '').trim();
    if (catName && catName !== 'Todos') {
      newOrder.push(catName);
    }
  });
  
  // Verifica se a ordem mudou
  const currentOrderStr = JSON.stringify(customCategoryOrder);
  const newOrderStr = JSON.stringify(newOrder);
  
  if (currentOrderStr !== newOrderStr && newOrder.length > 0) {
    customCategoryOrder = newOrder;
    saveCustomOrder(); // Isso ativa automaticamente a ordenação personalizada
    showToast('✨', 'Ordem personalizada ativada!');
  }
}

// ============================================================
//  BUILD SIDEBAR
// ============================================================
function buildSidebar() {
  const nav = document.getElementById('sidebarNav');
  const cats = getCategories();
  const counts = {};
  scripts.forEach(s => { counts[s.cat] = (counts[s.cat] || 0) + 1; });

  const categoryList = cats.filter(c => c !== 'all');
  
  let orderedCats = categoryList;
  if (sortBy === 'custom' && customCategoryOrder.length > 0) {
    orderedCats = getOrderedCategories(categoryList);
  }

  let html = '<div class="cat-lbl">Visão geral</div><ul>' +
    `<li><a onclick="setCat('all')" class="${activeCat === 'all' ? 'active' : ''}">
      📋 Todos <span class="nav-count">${scripts.length}</span></a></li></ul>`;

  html += '<div class="cat-lbl">Categorias</div><ul>';
  orderedCats.forEach(cat => {
    const count = counts[cat] || 0;
    const isActive = activeCat === cat;
    html += `<li draggable="true" style="cursor:grab;">
      <a onclick="setCat('${cat.replace(/'/g, "\\'")}')" class="${isActive ? 'active' : ''}">
        ${cat} <span class="nav-count">${count}</span>
      </a>
    </li>`;
  });
  html += '</ul>';

  nav.innerHTML = html;
  
  setTimeout(initDragDrop, 50);
}

function setCat(cat) {
  activeCat = cat;
  searchQ = '';
  document.getElementById('searchInput').value = '';
  document.getElementById('pageTitle').innerHTML = cat === 'all' ? 'Todos os scripts' : cat;
  buildSidebar();
  render();
}

function onSearch(val) {
  searchQ = val;
  render();
}

// ============================================================
//  RENDER
// ============================================================
function render() {
  const list = getFilteredScripts();
  const badge = document.getElementById('badge');
  const empty = document.getElementById('empty');
  const container = document.getElementById('cards');

  badge.textContent = list.length + (list.length === 1 ? ' script' : ' scripts');

  if (list.length === 0) {
    container.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  container.innerHTML = list.map(s => cardHTML(s)).join('');
}

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function cardHTML(s) {
  let displayHTML = applyGreetingForDisplay(s.html);
  displayHTML = applySignature(displayHTML);

  return `
  <div class="card" id="c${s.id}">
    <div class="card-hd" onclick="toggleCard(${s.id})">
      <div class="card-info">
        <div class="card-title">
          ${escapeHtml(s.title)}
          <span class="greeting-icon">🕐 Saudação automática</span>
        </div>
        <span class="card-tag">${escapeHtml(s.cat)}</span>
      </div>
      <div class="card-btns" onclick="event.stopPropagation()">
        <button class="btn btn-copy" id="cb${s.id}" onclick="copyScript(${s.id})">📋 Copiar</button>
        <button class="btn btn-ghost" onclick="startEdit(${s.id})">✏️ Editar</button>
        <button class="btn btn-del" onclick="deleteScript(${s.id})">🗑️</button>
      </div>
      <svg class="chev" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="card-body">
      <div class="preview" id="pv${s.id}">${displayHTML}</div>
      <div class="editor-wrap" id="ew${s.id}">
        <div class="fmt-bar">
          <button class="fmt-btn" onmousedown="event.preventDefault();document.execCommand('bold')"><b>B</b></button>
          <button class="fmt-btn" onmousedown="event.preventDefault();document.execCommand('italic')"><i>I</i></button>
          <button class="fmt-btn" onmousedown="event.preventDefault();document.execCommand('underline')"><u>U</u></button>
          <div class="fmt-sep"></div>
          <button class="fmt-btn" onmousedown="event.preventDefault();document.execCommand('insertUnorderedList')">•</button>
        </div>
        <div contenteditable="true" id="ce${s.id}" data-placeholder="Texto do script…" oninput="livePreview(${s.id})"></div>
        <div class="live-preview" id="lp${s.id}">
          <div class="label">📄 Prévia ao vivo</div>
          <div id="lpContent${s.id}"></div>
        </div>
        <div class="edit-bar">
          <button class="btn btn-save" onclick="saveEdit(${s.id})">💾 Salvar</button>
          <button class="btn btn-ghost" onclick="cancelEdit(${s.id})">Cancelar</button>
          <input class="title-field" id="tt${s.id}" placeholder="Título do script" value="${escapeHtml(s.title)}">
        </div>
      </div>
    </div>
  </div>`;
}

function toggleCard(id) {
  document.getElementById('c' + id).classList.toggle('open');
}

// ============================================================
//  EDIÇÃO
// ============================================================
function startEdit(id) {
  const s = scripts.find(x => x.id === id);
  const card = document.getElementById('c' + id);
  card.classList.add('open');
  document.getElementById('pv' + id).classList.add('editing-mode');
  document.getElementById('ew' + id).classList.add('visible');
  const ce = document.getElementById('ce' + id);
  ce.innerHTML = s.html;
  ce.focus();
  livePreview(id);
}

function cancelEdit(id) {
  document.getElementById('pv' + id).classList.remove('editing-mode');
  document.getElementById('ew' + id).classList.remove('visible');
  document.getElementById('lp' + id).classList.remove('visible');
}

function livePreview(id) {
  const ce = document.getElementById('ce' + id);
  const lp = document.getElementById('lp' + id);
  const content = document.getElementById('lpContent' + id);
  let html = ce.innerHTML;
  html = applyGreetingForDisplay(html);
  html = applySignature(html);
  content.innerHTML = html || '<span style="color:var(--text-secondary);opacity:.5;">Nenhum conteúdo ainda</span>';
  lp.classList.add('visible');
}

function saveEdit(id) {
  const idx = scripts.findIndex(x => x.id === id);
  const ce = document.getElementById('ce' + id);
  let newHTML = ce.innerHTML;
  const newTitle = document.getElementById('tt' + id).value.trim();

  newHTML = cleanEditorHtml(newHTML);

  if (!newHTML.includes('<saudacao>')) {
    newHTML = '<p><saudacao>, </p>' + newHTML;
  }
  if (!newHTML.includes('[NOME_USUARIO]')) {
    newHTML += '<p>Atenciosamente,<br>[NOME_USUARIO]</p>';
  }

  scripts[idx].html = newHTML;
  if (newTitle) scripts[idx].title = newTitle;

  let displayHTML = applyGreetingForDisplay(newHTML);
  displayHTML = applySignature(displayHTML);
  document.getElementById('pv' + id).innerHTML = displayHTML;

  cancelEdit(id);
  saveToLocal();
  buildSidebar();
  render();
}

function cleanEditorHtml(html) {
  let cleaned = html.replace(/<span style="[^"]*">/g, '');
  cleaned = cleaned.replace(/<\/span>/g, '');
  cleaned = cleaned.replace(/<p><\/p>/g, '');
  cleaned = cleaned.replace(/<br>$/g, '');
  cleaned = cleaned.replace(/<p><saudacao><\/p>/g, '<saudacao>');
  return cleaned;
}

function deleteScript(id) {
  if (!confirm('Excluir este script permanentemente?')) return;
  scripts = scripts.filter(x => x.id !== id);
  saveToLocal();
  buildSidebar();
  render();
  showToast('🗑️', 'Script excluído');
}

// ============================================================
//  COPIAR
// ============================================================
async function copyScript(id) {
  const s = scripts.find(x => x.id === id);
  if (!s) return;

  let processedHTML = applyGreetingForDisplay(s.html);
  processedHTML = applySignature(processedHTML);

  const tempDiv = document.createElement('div');
  tempDiv.innerHTML = processedHTML;
  const plainText = tempDiv.innerText || tempDiv.textContent;

  try {
    const blob = new Blob([processedHTML], { type: 'text/html' });
    const blobPlain = new Blob([plainText], { type: 'text/plain' });
    await navigator.clipboard.write([
      new ClipboardItem({ 'text/html': blob, 'text/plain': blobPlain })
    ]);

    const btn = document.getElementById('cb' + s.id);
    btn.classList.add('ok');
    btn.innerHTML = '✅ Copiado!';
    setTimeout(() => { btn.classList.remove('ok'); btn.innerHTML = '📋 Copiar'; }, 2000);
    showToast('📋', 'Texto copiado com formatação!');
  } catch (err) {
    navigator.clipboard.writeText(plainText);
    showToast('📋', 'Copiado (somente texto)');
  }
}

// ============================================================
//  ADICIONAR SCRIPT
// ============================================================
function openModal() {
  const sel = document.getElementById('newCat');
  sel.innerHTML = '';
  getCategories().forEach(c => {
    if (c !== 'all') sel.innerHTML += `<option>${escapeHtml(c)}</option>`;
  });
  document.getElementById('newTitle').value = '';
  document.getElementById('newCatCustom').value = '';
  document.getElementById('newText').value = '';
  document.getElementById('overlay').classList.add('show');
}

function closeModal() {
  document.getElementById('overlay').classList.remove('show');
}

function textToHTML(txt) {
  let html = txt.split(/\n\n+/).map(block => {
    const lines = block.split('\n').map(l => escapeHtml(l)).join('<br>');
    return '<p>' + lines + '</p>';
  }).join('');
  return '<p><saudacao>, </p>' + html + '<p>Atenciosamente,<br>[NOME_USUARIO]</p>';
}

function addScript() {
  const title = document.getElementById('newTitle').value.trim();
  const text = document.getElementById('newText').value.trim();
  const cat = document.getElementById('newCatCustom').value.trim() ||
              document.getElementById('newCat').value || 'Geral';

  if (!title || !text) {
    showToast('⚠️', 'Preencha título e texto');
    return;
  }

  scripts.push({ id: nextId++, cat, title, html: textToHTML(text) });
  closeModal();
  activeCat = cat;
  searchQ = '';
  document.getElementById('pageTitle').innerHTML = cat;
  saveToLocal();
  buildSidebar();
  render();
  showToast('✅', 'Script adicionado!');
}

// ============================================================
//  EXPORT / IMPORT
// ============================================================
function exportJSON() {
  const json = JSON.stringify(scripts, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'scripts.json';
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('📤', 'scripts.json exportado!');
}

function handleImport(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const imported = JSON.parse(e.target.result);
      if (Array.isArray(imported)) {
        scripts = imported;
        nextId = Math.max(...scripts.map(s => s.id), 0) + 1;
        saveToLocal();
        buildSidebar();
        render();
        showToast('📥', 'Importado com sucesso!');
      } else throw new Error();
    } catch (err) {
      showToast('❌', 'Arquivo inválido');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ============================================================
//  DRAG & DROP (arquivo JSON)
// ============================================================
const dropZone = document.getElementById('dropZone');
if (dropZone) {
  dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.classList.add('dragover');
  });
  dropZone.addEventListener('dragleave', () => {
    dropZone.classList.remove('dragover');
  });
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file && file.name.endsWith('.json')) {
      const reader = new FileReader();
      reader.onload = function(ev) {
        try {
          const imported = JSON.parse(ev.target.result);
          if (Array.isArray(imported)) {
            scripts = imported;
            nextId = Math.max(...scripts.map(s => s.id), 0) + 1;
            saveToLocal();
            buildSidebar();
            render();
            showToast('📥', 'Importado com sucesso!');
          } else throw new Error();
        } catch (err) {
          showToast('❌', 'Arquivo inválido');
        }
      };
      reader.readAsText(file);
    } else {
      showToast('⚠️', 'Arraste um arquivo .json');
    }
  });
}

// ============================================================
//  TOAST
// ============================================================
function showToast(icon, msg) {
  const t = document.getElementById('toast');
  t.querySelector('.icon').textContent = icon;
  t.querySelector('.msg').textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 3000);
}

// ============================================================
//  INICIALIZAÇÃO
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  setTheme(getTheme());
  loadData();
});
document.getElementById('overlay').addEventListener('click', (e) => {
  if (e.target === document.getElementById('overlay')) closeModal();
});
